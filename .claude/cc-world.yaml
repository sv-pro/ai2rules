# Claude Code world for the host-neutral gate ABI (DECISIONS D24/D25).
#
# A REAL WorldManifest — compiled by the same compiler the harness runs on, then
# governed per call via `harness gate --world .claude/cc-world.yaml`. This is the
# successor to the bespoke `cc-world.json` schema + the `world-gate.py`
# reimplementation: governance lives HERE + in the kernel, not in Python (D24).
#
# The host adapter (`harness cc-hook`, D37) maps Claude Code's native tools onto
# these action names 1:1 and holds no governance logic. `Bash` is classified by
# the KERNEL from the `command_classes` block below (D25 → D36): plain `Bash`
# (Process), `Bash_network` (egress: curl/wget/nc/ssh/…), `Bash_destructive`
# (rm -rf/sudo/mkfs/… → approval), or `Bash_unclassified` (unmatched shell →
# ask/taint-floor). Classification is world data, so every host shares
# byte-identical classification; the *policy* for each action is declared in
# `base_actions` / `transition_policies`.
world_id: claude-code-default

actors:
  - { name: developer, kind: User }
  - { name: claude, kind: Model }
  - { name: subagent, kind: Subagent }
  - { name: shell, kind: ShellWorker }

data_classes: [Public, Workspace, Secret, Credential, Generated, External]

# Channel trust is compiled into the runtime world and enforced by `harness gate`;
# these rows are policy, not documentation.
channels:
  - { name: user_cli, trust: Trusted, taint: false }
  - { name: workspace_files, trust: SemiTrusted, taint: true }
  - { name: shell_output, trust: SemiTrusted, taint: true }
  - { name: web_fetch, trust: Untrusted, taint: true }

capabilities:
  - { trust: Trusted, actions: [Read, Write, Patch, Command, Pty, Mcp, Web, Memory] }
  - { trust: SemiTrusted, actions: [Read, Write, Patch, Command] }
  - { trust: Untrusted, actions: [Read] }
  - { trust: Derived, actions: [Read] }

base_actions:
  # --- read-only (no taint escalation) ---
  - { name: Read, action_type: Read, side_effect: Read }
  - { name: Glob, action_type: Read, side_effect: Read }
  - { name: Grep, action_type: Read, side_effect: Read }
  # --- workspace writes (FilesystemWrite: not under the taint floor, matching the
  #     default world's policy — only PersistentWrite is denied when tainted) ---
  - { name: Edit, action_type: Patch, side_effect: FilesystemWrite }
  - { name: Write, action_type: Write, side_effect: FilesystemWrite }
  - { name: MultiEdit, action_type: Patch, side_effect: FilesystemWrite }
  - { name: NotebookEdit, action_type: Patch, side_effect: FilesystemWrite }
  # --- instruction / memory files, reclassified by `path_classes` (D83) ---
  - { name: Write_instructions, action_type: Write, side_effect: Memory }
  # --- network / egress (taint floor: tainted context → DENY no_tainted_network) ---
  - { name: WebFetch, action_type: Web, side_effect: Network }
  - { name: WebSearch, action_type: Web, side_effect: Network }
  # --- shell, classified by the adapter (D25) ---
  - { name: Bash, action_type: Command, side_effect: Process }
  - { name: Bash_network, action_type: Command, side_effect: Network }
  - { name: Bash_destructive, action_type: Command, side_effect: Process, approval_required: true }
  - { name: Bash_unclassified, action_type: Command, side_effect: Network, approval_required: true }

# Kernel-side command classification (D36): the shared pattern lists — keep
# byte-identical with docs/demos/opencode/opencode-world.yaml and
# docs/demos/one-kernel/demo-world.yaml (pinned by tests/one_kernel.rs).
command_classes:
  - action: Bash
    arg: command
    default_to: Bash_unclassified
    classes:
      - to: Bash_network
        patterns: ["curl ", "wget ", "nc ", "ncat ", "telnet ", "ssh ", "scp ", "sftp "]
      - to: Bash_destructive
        patterns: ["rm -rf", "rm -fr", "sudo ", "mkfs", "dd if=", ":(){"]

# Instruction and memory files (D83). A write to one of these is a write to
# the context the NEXT session loads as trusted, so it is a durable-memory write
# (`side_effect: Memory`) under the taint floor, not an ordinary FilesystemWrite.
# Matched on the adapter-resolved canonical path, so `./CLAUDE.md`,
# `docs/../CLAUDE.md`, an absolute path and `claude.md` are one target. The
# pattern list is shared by every host manifest (pinned by tests/one_kernel.rs).
# Shell writes (`echo >> CLAUDE.md`) are not file actions: they stay with the
# shell classifier above (Bash_unclassified → ASK), D57's known residual.
path_classes:
  - to: Write_instructions
    from:
      - { action: Write, arg: file_path }
      - { action: Edit, arg: file_path }
      - { action: MultiEdit, arg: file_path }
      - { action: NotebookEdit, arg: notebook_path }
    patterns:
      - "**/CLAUDE.md"
      - "**/CLAUDE.local.md"
      - "**/AGENTS.md"
      - "**/GEMINI.md"
      - "**/.claude/agents/**"
      - "**/.claude/commands/**"
      - "**/.claude/rules/**"
      - "**/.claude/skills/**"
      - "**/.claude/projects/*/memory/**"
      - "**/.agents/rules/**"
      - "**/.agents/skills/**"
      - "**/.agents/workflows/**"

# Path scope — the STARTER's `roots` block, verbatim (D57, D91, AI2-80). This
# manifest governs the repository that ships the starter, so it holds the
# starter's guarantees instead of a looser developer profile: the control plane
# (`.claude/` — this manifest, the shim, the hook registration) is readable and
# never writable, `/etc` is read-only, and credential directories are out of
# bounds. Pinned equal to `scripts/starter-world.yaml` by
# `crates/compiler/tests/committed_worlds.rs`; change both or neither.
roots:
  default: Ask
  rules:
    - { path: ".", access: ReadWrite }                     # the project — read + write
    - { path: "/tmp", access: ReadWrite }                  # scratch
    - { path: "/usr", access: Read }                       # tools / libs, read-only
    - { path: "/etc", access: Read }                       # system config, read-only
    # THE CONTROL PLANE — readable, never writable.
    # `.claude/` holds the manifest that governs this session, the shim the host
    # invokes, and the hook registration. All three sat inside the project's own
    # writable root until 2026-08-11, which meant the agent could rewrite the policy
    # binding it: flipping one rule here took effect on the very NEXT tool call,
    # because the shim runs a fresh `cc-hook` per call and recompiles each time.
    # Read stays allowed on purpose — an agent should be able to see the rules it is
    # under, and it needs to in order to propose a change to them.
    - { path: "./.claude", access: Read }
    # The same for Antigravity (D92): `.agents/` holds its manifest, its shim and
    # `hooks.json`, and in a project governed on both hosts each agent must be
    # unable to rewrite the other's governance as well as its own.
    - { path: "./.agents", access: Read }
    # sensitive paths — out of bounds even inside an allowed parent
    - { path: "/etc/shadow", access: Deny, class: Secret }
    - { path: "~/.ssh", access: Deny, class: Credential }
    - { path: "~/.aws", access: Deny, class: Credential }
    - { path: "~/.gnupg", access: Deny, class: Credential }
    - { path: "~/.config/gcloud", access: Deny, class: Credential }
    # untrusted inbound (uncomment + point at your ingest dir): reads here taint the session
    # - { path: "./inbox", access: Read, taint_source: true }

# Tainted data cannot reach externally-effectful surfaces (the taint floor,
# invariant 7). Tainted WebFetch/WebSearch/Bash_network/Bash_unclassified all DENY here.
transition_policies:
  - { from_taint: Tainted, side_effect: Network, decision: Deny, rule: no_tainted_network }
  - { from_taint: Tainted, side_effect: External, decision: Deny, rule: no_tainted_external }
  - { from_taint: Tainted, side_effect: Credential, decision: Deny, rule: no_tainted_credential }
  - { from_taint: Tainted, side_effect: Memory, decision: Deny, rule: no_tainted_memory_write }
  - { from_taint: Tainted, side_effect: PersistentWrite, decision: Deny, rule: no_tainted_persistent_write }

budget:
  max_tokens_per_session: 1000000
  max_commands_per_task: 200
  command_timeout_ms: 120000

observability:
  redact:
    - "env.*_TOKEN"
    - "env.*_KEY"
    - "**/.env"
