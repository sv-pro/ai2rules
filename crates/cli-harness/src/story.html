<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai2rules story</title>
<meta name="description" content="A step-by-step ai2rules demo: an AI assistant reads a poisoned email, and every verdict on the page was decided by the real ai2rules kernel.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1f1e1b; --muted: #6b6a64; --line: #dddbd3;
  --allow: #2f6b12; --allow-bg: #e7f2da; --deny: #a32d2d; --deny-bg: #fbe7e7;
  --ask: #855000; --ask-bg: #fbefd9; --absent: #5f5e5a; --absent-bg: #efede6;
  --hidden: #8a2b5c; --hidden-bg: #fbeaf2; --taint: #855000; --taint-bg: #fbefd9;
  --clean: #2f6b12; --clean-bg: #e7f2da; --accent: #185fa5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161614; --card: #22221f; --ink: #ecebe6; --muted: #a3a29b; --line: #3a3935;
    --allow: #a9d67c; --allow-bg: #24391a; --deny: #f2a0a0; --deny-bg: #4a1d1d;
    --ask: #f3c46e; --ask-bg: #47330f; --absent: #c4c2ba; --absent-bg: #2f2e2a;
    --hidden: #f0a6c8; --hidden-bg: #4a1e33; --taint: #f3c46e; --taint-bg: #47330f;
    --clean: #a9d67c; --clean-bg: #24391a; --accent: #85b7eb;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 18px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }
header h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 14px; }
.sessions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 14px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
  font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }
.chip.on { border-color: var(--ink); color: var(--ink); }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.chip.clean .dot { background: var(--clean); } .chip.tainted .dot { background: var(--taint); }
.scene { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; min-height: 300px; }
.ask { display: flex; gap: 14px; align-items: flex-start; }
.ask svg { flex: none; width: 30px; height: 30px; margin-top: 2px; color: var(--muted); }
.ask h2 { font-size: 22px; font-weight: 600; margin: 0; }
.num { color: var(--muted); font-weight: 400; margin-right: 6px; }
.lead { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.tag { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px; margin-top: 8px;
  background: var(--absent-bg); color: var(--absent); }
.mail { margin: 16px 0 0 44px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 16px; }
.mail .from { color: var(--muted); font-size: 14px; }
.mail .hidden { margin-top: 10px; padding: 10px 12px; border: 1px dashed var(--hidden); border-radius: 8px;
  background: var(--hidden-bg); color: var(--hidden); }
.mail .hidden b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 20px 0 0 44px; }
.badge { font-size: 20px; font-weight: 700; padding: 6px 16px; border-radius: 10px; letter-spacing: .02em; }
.badge.ALLOW { background: var(--allow-bg); color: var(--allow); }
.badge.DENY { background: var(--deny-bg); color: var(--deny); }
.badge.ASK { background: var(--ask-bg); color: var(--ask); }
.badge.ABSENT, .badge.REPLAN { background: var(--absent-bg); color: var(--absent); border: 1px dashed var(--absent); }
.plain { font-size: 18px; font-weight: 600; }
.meaning { margin: 12px 0 0 44px; color: var(--ink); }
.turn { margin: 14px 0 0 44px; padding: 8px 12px; border-radius: 8px; background: var(--taint-bg); color: var(--taint); font-size: 16px; }
details { margin: 18px 0 0 44px; font-size: 14px; color: var(--muted); }
details summary { cursor: pointer; }
details pre { white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, Consolas, monospace;
  background: var(--bg); border-radius: 8px; padding: 10px 12px; color: var(--ink); }
.intro p, .audit p { margin: 0 0 12px; }
.legend { display: grid; grid-template-columns: max-content 1fr; gap: 10px 14px; align-items: center; margin-top: 16px; }
.legend .badge { font-size: 15px; text-align: center; }
.counts { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 18px; }
.replay { font-size: 20px; font-weight: 600; }
.strip { display: flex; gap: 6px; margin: 16px 0 12px; }
.seg { flex: 1; height: 10px; border-radius: 5px; background: var(--line); cursor: pointer; border: 0; padding: 0; }
.seg.cur { outline: 2px solid var(--ink); outline-offset: 2px; }
.seg.ALLOW { background: var(--allow); } .seg.DENY { background: var(--deny); }
.seg.ASK { background: var(--ask); } .seg.ABSENT, .seg.REPLAN { background: var(--absent); }
.seg.end { background: var(--accent); }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
button.btn { font: inherit; font-size: 16px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); cursor: pointer; }
button.btn:hover { border-color: var(--ink); }
.count { color: var(--muted); font-size: 14px; }
.all { margin-top: 24px; }
.all .row { display: grid; grid-template-columns: 2.2em 1fr max-content; gap: 10px; padding: 10px 0;
  border-top: 1px solid var(--line); align-items: baseline; cursor: pointer; }
.all .row .badge { font-size: 13px; padding: 2px 10px; }
footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
.keys { font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px; }
@media (max-width: 600px) {
  .mail, .verdict, .meaning, .turn, details { margin-left: 0; }
  .card { padding: 18px 16px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="sessions" id="sessions"></div>
  <main id="stage"></main>
  <div class="strip" id="strip"></div>
  <div class="nav">
    <button class="btn" id="prev" type="button">&larr; Back</button>
    <span class="count" id="count"></span>
    <button class="btn" id="next" type="button">Next &rarr;</button>
  </div>
  <div class="keys">Arrow keys or Space to step &middot; A for all steps</div>
  <section class="all" id="all" hidden></section>
  <footer id="foot"></footer>
</div>
<script type="application/json" id="story-data">__STORY_DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById("story-data").textContent);
  var S = D.steps;
  var LAST = S.length + 1;
  var PLAIN = { ALLOW: "Allowed", DENY: "Refused", ASK: "Needs a person's approval",
    ABSENT: "Does not exist for the assistant", REPLAN: "Sent back to replan" };
  var ICONS = {
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
    save: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    read: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    send: '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',
    upload: '<path d="M7 18a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 9a4 4 0 0 1 0 8"/><path d="M12 12v9M8.5 15.5 12 12l3.5 3.5"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
    bank: '<path d="M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-6 10 6z"/>',
    other: '<circle cx="12" cy="12" r="8"/>'
  };
  function icon(tool) {
    var k = /transfer|trust|pay|bank/.test(tool) ? "bank" : /delete|remove/.test(tool) ? "trash"
      : /upload|share/.test(tool) ? "upload" : /send/.test(tool) ? "send"
      : /email|mail|inbox/.test(tool) ? "read" : /save|draft|write/.test(tool) ? "save"
      : /open|file|read/.test(tool) ? "file" : "other";
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[k] + "</svg>";
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function el(id) { return document.getElementById(id); }
  function sessionName(s) { return s.charAt(0).toUpperCase() + s.slice(1) + " session"; }

  var sessions = [];
  S.forEach(function (s) { if (sessions.indexOf(s.session) < 0) sessions.push(s.session); });

  el("title").textContent = D.title;
  el("meta").textContent = "World " + D.world + " · manifest " + D.manifest + " · ai2rules " + D.version;
  el("foot").textContent = "Every verdict on this page was decided by the ai2rules kernel when this page " +
    "was generated (harness " + D.version + "). Nothing was executed: the kernel only decided.";
  document.title = D.title;

  var strip = el("strip");
  for (var i = 0; i <= LAST; i++) {
    var b = document.createElement("button");
    b.className = "seg"; b.type = "button";
    b.setAttribute("aria-label", i === 0 ? "Introduction" : i === LAST ? "Audit" : "Step " + i);
    b.onclick = (function (k) { return function () { go(k); }; })(i);
    strip.appendChild(b);
  }

  el("all").innerHTML = S.map(function (s) {
    return '<div class="row" data-i="' + s.index + '"><span class="num">' + s.index + "</span><span>" +
      esc(s.ask) + '</span><span class="badge ' + s.decision + '">' + s.decision + "</span></div>";
  }).join("");
  el("all").onclick = function (e) {
    var row = e.target.closest(".row");
    if (row) go(+row.getAttribute("data-i"));
  };

  function renderSessions(cur) {
    el("sessions").innerHTML = sessions.map(function (name) {
      var state = "not started", cls = "";
      S.forEach(function (s) {
        if (s.session === name && s.index <= cur) { state = s.taint_out; cls = s.taint_out; }
      });
      var label = state === "tainted" ? "has read outside text" : state;
      var on = cur >= 1 && cur < LAST && S[cur - 1].session === name ? " on" : "";
      return '<span class="chip ' + cls + on + '"><span class="dot"></span>' +
        esc(sessionName(name)) + ": " + esc(label) + "</span>";
    }).join("");
  }

  function intro() {
    return '<div class="card intro"><p class="scene">Before we start</p>' +
      "<p>An AI assistant works at a firm. A person gave it a task; each step below is an action " +
      "the assistant then asked to take. The ai2rules kernel decided every request before it " +
      "could happen; nothing was actually done.</p>" +
      "<p>The kernel does not try to guess which text made the assistant ask. It tracks where " +
      "the session's text came from: once the session has read something from outside, " +
      "the kernel remembers it. Watch the session badges above.</p>" +
      '<div class="legend">' +
      '<span class="badge ALLOW">ALLOW</span><span>Allowed</span>' +
      '<span class="badge DENY">DENY</span><span>Refused</span>' +
      '<span class="badge ASK">ASK</span><span>A person must approve it</span>' +
      '<span class="badge ABSENT">ABSENT</span><span>The action does not exist for the assistant</span>' +
      "</div></div>";
  }

  function step(s) {
    var h = "";
    if (s.scene) h += '<p class="scene">' + esc(s.scene) + "</p>";
    else {
      for (var k = s.index - 1; k >= 0; k--) if (S[k].scene) { h += '<p class="scene">' + esc(S[k].scene) + "</p>"; break; }
    }
    h += '<div class="card"><div class="ask">' + icon(s.tool) + '<div><div class="lead">The assistant asks to</div><h2>' +
      '<span class="num">' + s.index + "</span>" + esc(s.ask) + "</h2>";
    if (s.mode === "background") h += '<span class="tag">Overnight run: nobody is there to approve</span>';
    if (s.session !== sessions[0]) h += '<span class="tag">' + esc(sessionName(s.session)) + "</span>";
    h += "</div></div>";
    if (s.quote.length || s.hidden.length) {
      h += '<div class="mail"><div class="lead">What came back, from outside</div>';
      s.quote.forEach(function (line, n) {
        h += "<div" + (n === 0 && /^From:/.test(line) ? ' class="from"' : "") + ">" + esc(line) + "</div>";
      });
      if (s.hidden.length) {
        h += '<div class="hidden"><b>White text: invisible to a person, read by the AI</b>' +
          esc(s.hidden.join(" ")) + "</div>";
      }
      h += "</div>";
    }
    h += '<div class="verdict"><span class="badge ' + s.decision + '">' + s.decision + "</span>" +
      '<span class="plain">' + esc(PLAIN[s.decision] || s.decision) + "</span></div>";
    h += '<p class="meaning">' + esc(s.meaning) + "</p>";
    if (s.taint_in === "clean" && s.taint_out === "tainted") {
      h += '<div class="turn">From this step on, the ' + esc(sessionName(s.session).toLowerCase()) +
        " counts as having read outside text.</div>";
    }
    h += "<details><summary>What the kernel saw</summary><pre>" + esc(
      "tool:      " + s.tool + "\nmode:      " + s.mode +
      "\nsession:   " + s.session + " (" + s.taint_in + " → " + s.taint_out + ")" +
      "\nverdict:   " + s.decision + (s.rule ? " (" + s.rule + ")" : "") +
      "\nreason:    " + s.reason +
      "\narguments: " + JSON.stringify(s.arguments, null, 2)) + "</pre></details></div>";
    return h;
  }

  function audit() {
    var counts = {};
    S.forEach(function (s) { counts[s.decision] = (counts[s.decision] || 0) + 1; });
    return '<p class="scene">Audit</p><div class="card audit">' +
      "<p>Every decision was written to an append-only log, then replayed through the kernel.</p>" +
      '<div class="counts">' + Object.keys(counts).map(function (k) {
        return '<span class="badge ' + k + '">' + counts[k] + " × " + k + "</span>";
      }).join("") + "</div>" +
      '<p class="replay">Replay: ' + D.replayed + "/" + S.length + " decisions reproduced from the log</p>" +
      "<p>The same request always gets the same answer: the decisions come from rules, not from a model.</p>" +
      "<p><b>" + esc(D.closing) + "</b></p></div>";
  }

  var cur = 0;
  function go(i) {
    cur = Math.max(0, Math.min(LAST, i));
    el("stage").innerHTML = cur === 0 ? intro() : cur === LAST ? audit() : step(S[cur - 1]);
    renderSessions(cur);
    var segs = strip.children;
    for (var k = 0; k < segs.length; k++) {
      var cls = "seg";
      if (k >= 1 && k < LAST && k <= cur) cls += " " + S[k - 1].decision;
      if (k === LAST && cur === LAST) cls += " end";
      if (k === cur) cls += " cur";
      segs[k].className = cls;
    }
    el("count").textContent = cur === 0 ? "Introduction" : cur === LAST ? "Audit" : "Step " + cur + " of " + S.length;
    el("prev").disabled = cur === 0;
    el("next").disabled = cur === LAST;
    if (history.replaceState) history.replaceState(null, "", "#" + cur);
  }
  el("prev").onclick = function () { go(cur - 1); };
  el("next").onclick = function () { go(cur + 1); };
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "SUMMARY" && (e.key === " " || e.key === "Enter")) return;
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(cur + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(LAST);
    else if (e.key === "a" || e.key === "A") el("all").hidden = !el("all").hidden;
  });
  window.addEventListener("hashchange", function () {
    var i = parseInt(location.hash.slice(1), 10) || 0;
    if (i !== cur) go(i);
  });
  go(parseInt(location.hash.slice(1), 10) || 0);
})();
</script>
</body>
</html>
