[package]
name = "cli-harness"
description = "Terminal entrypoint for the ai2rules harness (E9)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
harness-types = { workspace = true }
harness-preview = { workspace = true }
agent-core = { workspace = true }
compiler = { workspace = true }
world-kernel = { workspace = true }
executor = { workspace = true }
provider-adapters = { workspace = true }
trace-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Renders authored manifests as YAML (harness mcp-author, D79).
serde_yaml = "0.9"
tempfile = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
# Coloured story output that degrades to plain text when piped or under NO_COLOR.
anstream = "1.0.0"
anstyle = "1.0.14"
inquire = "0.9.4"
md5 = "0.7"

[dev-dependencies]
# The WASM engine compiled for the host: one more entry point in the one-kernel
# parity suite (tests/one_kernel.rs), so the browser build answers as `harness gate` does.
harness-wasm = { path = "../harness-wasm" }
