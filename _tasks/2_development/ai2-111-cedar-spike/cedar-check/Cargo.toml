# AI2-111 spike: business-layer checks with Cedar and its Lean-verified symbolic
# compiler. Deliberately NOT a member of the ai2rules workspace: the empty
# [workspace] table makes this its own workspace, so no kernel crate and no
# release artifact ever depends on Cedar (D27, D96).
[package]
name = "cedar-check"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
cedar-policy = "=4.14.0"
cedar-policy-symcc = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "macros"] }
