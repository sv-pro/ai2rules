name: DeepSeek integration

on:
  pull_request:
    paths:
      - ".github/workflows/deepseek-integration.yml"
      - "crates/cli-harness/**"
      - "crates/compiler/**"
      - "crates/harness-preview/**"
      - "crates/harness-types/**"
      - "crates/world-kernel/**"
      - "docs/demos/deepseek-harness/**"

permissions:
  contents: read

jobs:
  pinned-dsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - name: Build the projection and gate binary
        run: cargo build --locked -p cli-harness

      # The adapter's host contract is intentionally pinned: a current upstream
      # checkout would turn unrelated dsh drift into an ai2rules merge blocker.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 141eb6fef83422698aef7a981029e843e8161534
          path: .integration/deepseek-harness
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.20.0"
      - name: Install the pinned dsh workspace
        working-directory: .integration/deepseek-harness
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Mount the adapter spec beside the real dsh runner tests
        run: |
          cp docs/demos/deepseek-harness/ai2rules-gate.ts \
            .integration/deepseek-harness/packages/extensions/cordis-host-runner/tests/
          cp docs/demos/deepseek-harness/ai2rules-gate.spec.ts \
            .integration/deepseek-harness/packages/extensions/cordis-host-runner/tests/
      - name: Discovery and invocation share one governed world
        working-directory: .integration/deepseek-harness
        env:
          AI2R_HARNESS: ${{ github.workspace }}/target/debug/harness
          AI2R_WORLD: ${{ github.workspace }}/docs/demos/deepseek-harness/deepseek-world.yaml
        run: pnpm exec vitest run packages/extensions/cordis-host-runner/tests/ai2rules-gate.spec.ts
