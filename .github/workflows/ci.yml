name: CI

# CI for the Rust harness workspace (PLAN.md E0.6). The Python reference
# projects (agent-hypervisor/, safe-mcp-proxy/) have their own workflows and are
# not Cargo workspace members, so cargo commands here ignore them.
#
# GitLab equivalent (.gitlab-ci.yml) can mirror these four steps if needed.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  demos:
    # Guard what the demos *print*. The unit tests cover the kernel; they stayed
    # green twice while a hardening change silently hollowed out a demo (the
    # source_channel drift in demo-one-kernel-many-hosts.sh, and execution_demo's
    # third refusal going unrepresentable after D45). Both exited 0 throughout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Demos still say what they claim
        run: bash scripts/check-demos.sh

  npm-wrapper:
    # The `ai2rules-harness` wrapper (D56) is how a stranger gets a binary, and
    # nothing else in CI touches it. Two cheap checks: it parses, and its platform
    # map still matches what release.yml publishes. Drift between those two files
    # fails silently — a wrong target 404s on a URL nobody tested, and only ever
    # on someone else's machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check npm/install.js
          node --check npm/bin/harness.js
          node --check npm/verify-targets.js
      - name: Platform map matches the release matrix
        run: node npm/verify-targets.js

  hero-mcp:
    # TypeScript MCP tool under tools/hero-mcp (not a Cargo member); typecheck + unit
    # tests only — the agy-backed generation needs auth and isn't run in CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/hero-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  blog:
    # Build the Astro blog and guard that every post renders a hero image — a green
    # build alone doesn't prove that (heroImage is optional), so check the built HTML.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm run check:heroes
