name: CI

# CI for the Rust harness workspace (PLAN.md E0.6). The Python reference
# projects (agent-hypervisor/, safe-mcp-proxy/) have their own workflows and are
# not Cargo workspace members, so cargo commands here ignore them.
#
# GitLab equivalent (.gitlab-ci.yml) can mirror these four steps if needed.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Least privilege for the whole workflow. Nothing in CI writes to the repository,
# comments on a PR, or publishes anything; without this the jobs inherit whatever
# the repository default happens to be, which is write in many configurations.
# `release.yml` scopes its own permissions per job, because it genuinely needs
# `contents: write` and `id-token: write` to publish.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No version here on purpose: `rust-toolchain.toml` pins it, and rustup
      # honours that file. Naming a version in the workflow too would be a second
      # place to drift from — which is the bug this pin exists to prevent.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  demos:
    # Guard what the demos *print*. The unit tests cover the kernel; they stayed
    # green twice while a hardening change silently hollowed out a demo (the
    # source_channel drift in demo-one-kernel-many-hosts.sh, and execution_demo's
    # third refusal going unrepresentable after D45). Both exited 0 throughout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - name: Demos still say what they claim
        run: bash scripts/check-demos.sh

  wasm:
    # `blog/public/vendor/harness-wasm/` is a build output committed to git so the
    # playground can load it as a static asset — which means nothing rebuilt it.
    # It sat nine preview-affecting commits behind the kernel (the whole `roots`
    # feature, D36 classification) for seven weeks, advertising version 0.0.1,
    # while every job here stayed green (finding #18). AGENTS.md states the
    # no-drift invariant; this is what enforces it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Version comes from `rust-toolchain.toml`; only the extra target is set here.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # From crates.io rather than a third-party action: this workflow should not
      # take a supply-chain dependency the project would flag in a review.
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build the engine from source
        run: wasm-pack build --target web --release
        working-directory: crates/harness-wasm
      - name: Committed artifact must still answer for the kernel
        run: node scripts/check-wasm-freshness.mjs

  cross:
    # The release workflow cross-compiles; CI never did, so a change that breaks
    # the release build stayed invisible until a tag was pushed — which is exactly
    # how pinning the toolchain shipped a broken release: the target had been
    # installed for `stable` while cargo ran the pinned version, and every
    # cross-compiled job failed after CI had gone green. One target is enough to
    # catch that class; it is a proxy for "the release build still works", not a
    # full matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - name: Add the target to the pinned toolchain
        run: rustup target add x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Cross-compile the binary the way the release does
        run: cargo build --release --locked -p cli-harness --target x86_64-unknown-linux-musl

  npm-wrapper:
    # The npm packages (D56, restructured in D58) are how a stranger gets a
    # binary, and nothing else in CI touches them. Two cheap checks: they parse,
    # and the five-package layout is consistent — versions in lockstep, no install
    # script anywhere, every shipped platform actually built. Each of those fails
    # silently otherwise, and only ever on someone else's machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check npm/bin/harness.js
          node --check npm/verify-packages.js
      - name: Layout — versions in lockstep, no install scripts
        run: node npm/verify-packages.js

  hero-mcp:
    # TypeScript MCP tool under tools/hero-mcp (not a Cargo member); typecheck + unit
    # tests only — the agy-backed generation needs auth and isn't run in CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/hero-mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  blog:
    # Build the Astro blog and guard that every post renders a hero image — a green
    # build alone doesn't prove that (heroImage is optional), so check the built HTML.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm run check:heroes
      # A draft that reaches the build is worse than a published post: it looks
      # hidden while being fully reachable at its URL.
      - run: npm run check:drafts
      - run: npm run check:spacing
